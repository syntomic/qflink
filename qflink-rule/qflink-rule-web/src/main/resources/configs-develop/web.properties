# The console only owns these options, everything else is read from the rule job property file
# below, so the console always writes the channel the job reads.
web.port=8080
web.job-properties=qflink-rule/qflink-rule-engine/src/main/resources/configs-develop/job.properties

# where a qfile channel lives, they must match the module the job runs from
web.sources-dir=qflink-rule/qflink-rule-engine/src/main/resources/sources
web.sinks-dir=qflink-rule/qflink-rule-engine/src/main/resources/sinks

# the rules the console manages, the channel is an event stream and cannot be read back
web.data-dir=qflink-rule/qflink-rule-web/data

# how many alerts, errors and logs a page which just opened gets
web.history-size=500
# read a channel from the beginning, turn it off against a production topic
web.replay=true

# ! serve the page from the sources while working on it, a reload is then enough
# web.static-dir=qflink-rule/qflink-rule-web/src/main/resources/web

# the log line of the generator, it matches the flat map of the example rule
web.generator.template=${time} stdout {"key1": ${int(1,10)},"key2":"val${int(1,5)}"}
